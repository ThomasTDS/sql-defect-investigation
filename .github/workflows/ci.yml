name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Permite disparar a CI manualmente em qualquer branch, pela aba Actions
  # ou com: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

jobs:
  validate:
    name: Validação (Postgres embarcado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run validate

      # Confere se os resultados das explorações ainda batem com o que os
      # relatórios mostram (investigacoes/*/resultado-esperado.json).
      - run: npm run relatorios

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --wait só retorna quando o healthcheck passa, ou seja, depois que
      # todos os scripts de sql/ foram carregados (o healthcheck usa TCP,
      # que só abre ao fim da inicialização).
      - name: Subir o banco
        run: docker compose up -d --wait

      # Confere que as três camadas (schema, massa válida e massa quebrada)
      # foram carregadas: 10 clientes da massa válida + 1 duplicado + 3 da
      # investigação 06 = 14, e o pedido órfão da massa quebrada está lá.
      - name: Conferir dados carregados
        run: |
          query() {
            docker compose exec -T postgres psql -U postgres -d defect_investigation -tAc "$1"
          }
          clientes=$(query "SELECT COUNT(*) FROM clientes")
          orfaos=$(query "SELECT COUNT(*) FROM pedidos p LEFT JOIN clientes c ON c.id = p.cliente_id WHERE c.id IS NULL")
          echo "clientes: $clientes (esperado 14)"
          echo "pedidos órfãos: $orfaos (esperado 1)"

          marca() { [ "$1" = "$2" ] && echo "✅" || echo "❌"; }
          {
            echo "## Docker Compose"
            echo ""
            echo "| Conferência | Esperado | Encontrado | |"
            echo "|---|---|---|---|"
            echo "| clientes carregados | 14 | $clientes | $(marca "$clientes" 14) |"
            echo "| pedidos órfãos (massa quebrada) | 1 | $orfaos | $(marca "$orfaos" 1) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # Tem que ser a última linha: com bash -e, uma lista com && que
          # falha só derruba o passo quando é o último comando.
          [ "$clientes" = "14" ] && [ "$orfaos" = "1" ]

      # Roda cada exploracao.sql do jeito que o "Como reproduzir" dos
      # relatórios ensina. Com ON_ERROR_STOP, o psql sai com erro na
      # primeira query que falhar, e o job falha junto.
      - name: Executar as explorações das investigações
        run: |
          echo "**Explorações das investigações** (executadas com \`ON_ERROR_STOP\`):" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for arquivo in investigacoes/*/exploracao.sql; do
            echo "::group::$arquivo"
            if ! docker compose exec -T postgres psql -U postgres -d defect_investigation -v ON_ERROR_STOP=1 < "$arquivo"; then
              echo "- ❌ \`$arquivo\`" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::endgroup::"
            echo "- ✅ \`$arquivo\`" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Logs do container em caso de falha
        if: failure()
        run: docker compose logs postgres

      - name: Derrubar o banco
        if: always()
        run: docker compose down -v
